<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>TikTok connection | La Señal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="../img/lasenal.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #020617; color: #cbd5e1; }
        a { color: #38bdf8; }
    </style>
</head>
<body class="min-h-screen py-12 px-4 md:px-8">
    <!--
      OAuth redirect URI for La Señal's TikTok integration (Login Kit).
      TikTok sends the one-time authorization code here. The code is useless
      without the app's client secret, which never touches this site: it is
      exchanged for tokens on La Señal's own server. Nothing is stored here.
    -->
    <div class="max-w-xl mx-auto bg-slate-900/50 p-8 rounded-3xl border border-slate-800 text-center">
        <img src="../img/lasenal.png" alt="La Señal logo" class="w-20 h-20 rounded-full mx-auto mb-6">
        <h1 id="title" class="text-2xl font-bold text-white mb-4">TikTok connection</h1>
        <p id="msg" class="leading-relaxed mb-6">Waiting for TikTok…</p>
        <code id="code" class="hidden block break-all bg-slate-800 p-4 rounded-xl text-left text-sm text-slate-100"></code>
        <p class="mt-8 text-sm"><a href="../lasenal.html">La Señal</a> · <a href="../privacy.html">Privacy Policy</a></p>
    </div>
    <script>
        const q = new URLSearchParams(location.search);
        const title = document.getElementById("title");
        const msg = document.getElementById("msg");
        const code = document.getElementById("code");
        if (q.get("error")) {
            title.textContent = "Connection not completed";
            msg.textContent = "TikTok returned: " + q.get("error") + (q.get("error_description") ? " — " + q.get("error_description") : "");
        } else if (q.get("code")) {
            const esperado = sessionStorage.getItem("tiktok_state");
            if (esperado && esperado !== q.get("state")) {
                title.textContent = "Connection not completed";
                msg.textContent = "The security check (state) did not match. Start again from the Connect page.";
                history.replaceState(null, "", location.pathname);
                throw new Error("state mismatch");
            }
            title.textContent = "Account connected";
            msg.textContent = "Copy this one-time code back to the La Señal publisher. It expires in a few minutes.";
            code.textContent = "code=" + q.get("code") + "\nstate=" + (q.get("state") || "");
            code.classList.remove("hidden");
        } else {
            msg.textContent = "This page is only used when connecting La Señal's own TikTok account.";
        }
        // the code must not stay in the address bar or the browser history
        history.replaceState(null, "", location.pathname);
    </script>
</body>
</html>
